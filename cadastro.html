
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ThreatEye - Cadastro</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="theme.js"></script>
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="login-header">
                <h1>Criar conta</h1>
                <p>Preencha seus dados para começar a usar o ThreatEye.</p>
            </div>

            <form id="cadastroForm" class="login-form" novalidate>

                <!-- Nome -->
                <div class="input-group">
                    <label for="nome">Nome</label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input
                            type="text"
                            id="nome"
                            placeholder="Seu nome"
                            autocomplete="name"
                            aria-describedby="nomeError"
                            required
                        >
                    </div>

                    <span class="error-message" id="nomeError" role="alert"></span>
                </div>

                <!-- E-mail -->
                <div class="input-group">
                    <label for="email">E-mail</label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input
                            type="email"
                            id="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                            inputmode="email"
                            autocapitalize="off"
                            spellcheck="false"
                            aria-describedby="emailError"
                            required
                        >
                    </div>

                    <span class="error-message" id="emailError" role="alert"></span>
                </div>

                <!-- Senha -->
                <div class="input-group">
                    <label for="password">Senha</label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input
                            type="password"
                            id="password"
                            placeholder="Crie uma senha"
                            autocomplete="new-password"
                            minlength="8"
                            aria-describedby="passwordHint passwordError"
                            required
                        >
                    </div>

                    <span class="form-hint" id="passwordHint">Use pelo menos 8 caracteres.</span>
                    <span class="error-message" id="passwordError" role="alert"></span>
                </div>

                <!-- Confirmar senha -->
                <div class="input-group">
                    <label for="confirmPassword">Confirmar senha</label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Digite sua senha novamente"
                            autocomplete="new-password"
                            aria-describedby="confirmPasswordError"
                            required
                        >
                    </div>

                    <span class="error-message" id="confirmPasswordError" role="alert"></span>
                </div>

                <p class="form-ok" id="cadastroOk" role="status" hidden><i class="fa-solid fa-circle-check" aria-hidden="true"></i> Conta criada! Redirecionando para o login…</p>

                <button type="submit" class="btn-submit">
                    <span class="btn-text">Criar conta</span>
                </button>

            </form>

            <div class="login-footer">
                <p>Já tem uma conta? <a href="login.html">Entrar</a></p>
            </div>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
