<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ThreatEye - Login</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="theme.js"></script>
</head>
<body>
    
    <main class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Bem-vindo</h1>
                <p>Entre com suas credenciais para acessar sua conta.</p>
            </div>

            <form id="loginForm" class="login-form" novalidate>
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="seu@email.com" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required aria-describedby="emailError">
                    </div>
                    <span class="error-message" id="emailError" role="alert"></span>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="password">Senha</label>
                        <a href="#" class="forgot-password" id="esqueciSenha">Esqueceu a senha?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required aria-describedby="passwordError">
                        <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar senha" aria-pressed="false">
                            <svg class="eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <g class="eye-open"><path fill-rule="evenodd" d="M12 5C6.6 5 2.9 8.9 1.5 12c1.4 3.1 5.1 7 10.5 7s9.1-3.9 10.5-7C21.1 8.9 17.4 5 12 5Zm0 3.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/><circle cx="12" cy="12" r="1.7"/></g>
                                <g class="eye-closed"><path d="M2.2 9.4C4.4 13 7.8 14.9 12 14.9s7.6-1.9 9.8-5.5l-1.8-1c-1.8 2.9-4.6 4.5-8 4.5s-6.2-1.6-8-4.5l-1.8 1Z"/><path class="lash" d="M12 15.4v3M6.8 14.2 5.4 16.6M17.2 14.2l1.4 2.4"/></g>
                            </svg>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError" role="alert"></span>
                </div>

                <p class="form-info" id="loginInfo" role="status" hidden></p>

                <button type="submit" class="btn-submit">
                    <span class="btn-text">Entrar</span>
                    <div class="spinner hidden"></div>
                </button>
            </form>

            <div class="login-footer">
                <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
